[project]
name = "opsec-scanner"
version = "0.5.0"
description = "Self-audit OPSEC leak scanner for git history, media metadata, and identity correlation."
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1.43",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pypdf>=4.0.0"]

[project.scripts]
opsec-scan = "opsec_scanner.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opsec_scanner*"]
